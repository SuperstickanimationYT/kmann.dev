<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planet Texture Generator &mdash; kmann314</title>
<meta name="description" content="Generate procedural planet textures from a handful of dials, or roll random ones, and save them as PNG.">
<link rel="icon" href="../../assets/img/mark.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="../../assets/css/site.css">
<link rel="stylesheet" href="../../assets/css/studio.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-page studio">

<header class="studio-bar">
  <a class="mark" href="../../" aria-label="All projects">
    <img src="../../assets/img/mark.svg" alt="">
  </a>
  <h1 class="studio-title">Planet Texture Generator</h1>
</header>

<main class="studio-stage ptg-stage">
  <canvas data-preview></canvas>
</main>

<aside class="studio-panel" data-studio-panel aria-label="Settings">
  <button type="button" class="studio-handle" data-studio-handle aria-expanded="true"><span class="studio-grabber"></span>Settings</button>
  <div class="studio-panel-body">
    <form class="ptg-panel" data-controls>
      <div class="ptg-actions">
        <button type="button" class="ptg-primary" data-randomize>Randomize planet</button>
        <button type="button" data-reroll>New seed</button>
      </div>

      <div class="ptg-actions ptg-history">
        <button type="button" data-undo disabled>Undo</button>
        <button type="button" data-redo disabled>Redo</button>
      </div>

      <label class="ptg-field">
        <span>Preset</span>
        <select data-preset>
          <option value="">Custom</option>
        </select>
      </label>

      <label class="ptg-field">
        <span>Seed</span>
        <input type="number" name="seed" min="1" max="999999" step="1">
      </label>

      <fieldset data-physical>
        <legend>Physics</legend>
        <label class="ptg-field">
          <span>Kind</span>
          <select name="kind">
            <option value="rocky">Rocky</option>
            <option value="giant">Gas giant</option>
          </select>
        </label>
        <label class="ptg-field">
          <span>Temperature (K) <output></output></span>
          <input type="range" name="temperature" min="30" max="1500" step="5">
        </label>
        <label class="ptg-field" data-rocky-only>
          <span>Water % <output></output></span>
          <input type="range" name="water" min="0" max="100" step="1">
        </label>
        <label class="ptg-field" data-rocky-only>
          <span>Atmosphere <output></output></span>
          <input type="range" name="atmosphere" min="0" max="100" step="1">
        </label>
        <p class="ptg-note">Moving these redraws the look below. Fine-tune it afterwards.</p>
      </fieldset>

      <fieldset>
        <legend>Surface</legend>
        <label class="ptg-field ptg-color">
          <span>Base color</span>
          <input type="color" name="baseColor">
        </label>
        <label class="ptg-field">
          <span>Variation <output></output></span>
          <input type="range" name="variation" min="0" max="50" step="1">
        </label>
        <label class="ptg-field">
          <span>Darkness <output></output></span>
          <input type="range" name="darkness" min="0" max="80" step="1">
        </label>
        <label class="ptg-field">
          <span>Gas giant bands <output></output></span>
          <input type="range" name="bands" min="0" max="10" step="0.5">
        </label>
      </fieldset>

      <fieldset>
        <legend>Features</legend>
        <label class="ptg-field">
          <span>Polar cap <output></output></span>
          <input type="range" name="polarCap" min="0" max="180" step="1">
        </label>
        <label class="ptg-field">
          <span>Craters <output></output></span>
          <input type="range" name="craters" min="0" max="40" step="1">
        </label>
        <label class="ptg-field">
          <span>Clouds <output></output></span>
          <input type="range" name="clouds" min="0" max="150" step="1">
        </label>
        <label class="ptg-field">
          <span>Lava <output></output></span>
          <input type="range" name="lava" min="0" max="100" step="1">
        </label>
      </fieldset>

      <fieldset>
        <legend>Atmosphere</legend>
        <label class="ptg-field">
          <span>Haze <output></output></span>
          <input type="range" name="haze" min="0" max="100" step="1">
        </label>
        <label class="ptg-field ptg-color">
          <span>Haze color</span>
          <input type="color" name="hazeColor">
        </label>
      </fieldset>

      <fieldset>
        <legend>
          <label class="ptg-toggle"><input type="checkbox" name="land"> Continents</label>
        </legend>
        <label class="ptg-field ptg-color">
          <span>Land color</span>
          <input type="color" name="landColor">
        </label>
        <label class="ptg-field">
          <span>Land cover <output></output></span>
          <input type="range" name="landCover" min="0" max="100" step="1">
        </label>
      </fieldset>
    </form>

    <div class="ptg-export">
      <label class="ptg-field">
        <span>Download size</span>
        <select data-size>
          <option value="512">512 &times; 512</option>
          <option value="1024" selected>1024 &times; 1024</option>
          <option value="2048">2048 &times; 2048</option>
        </select>
      </label>
      <div class="ptg-actions">
        <button type="button" data-download="planet">Download planet</button>
        <button type="button" data-download="surface">Surface only</button>
        <button type="button" data-download="sky">Sky only</button>
        <button type="button" data-copy-link>Copy link</button>
      </div>
    </div>

    <p class="studio-footer"><a href="../../about.html">About me</a> &middot; &copy; 2026 kmann314</p>
    <button type="button" class="save-offline" data-save-offline hidden></button>
  </div>
</aside>

<script type="module" src="js/main.js"></script>
<script type="module" src="../../assets/js/studio.js"></script>
<script type="module" src="../../assets/js/offline.js"></script>
</body>
</html>
