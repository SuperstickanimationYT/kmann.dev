<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4D Projection Prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070b; color: #cfd6e0; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .panel { position: fixed; top: 8px; background: #0b1018d9; padding: 8px 10px; border-radius: 6px; white-space: pre; font: 12px/1.45 ui-monospace, monospace; }
  #hud { left: 8px; }
  #reveal { right: 8px; display: none; }
  #toggles { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 32px); }
  #toggles button { background: #141b26; color: #cfd6e0; border: 1px solid #2a3544; border-radius: 5px; padding: 5px 9px; font: inherit; cursor: pointer; }
  #toggles button.on { background: #27415f; border-color: #4d7bb0; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" class="panel"></div>
<div id="reveal" class="panel"></div>
<div id="toggles"></div>
<script>
const FOV_HALF_ANGLE_TAN = 1;
const NEAR = 0.05;
const WALK_SPEED = 3;
const FLY_SPEED = 3;
const TURN_SPEED = 1.1;
const GRAVITY = 18;
const JUMP_SPEED = 7.4;
const MAX_FALL_SPEED = 15;
const PHYSICS_STEP_S = 1 / 120;
const PLAYER_HALF_WIDTH = 0.25;
const PLAYER_HEIGHT = 0.9;
const CHASE_DISTANCE = 3.5;
const CHASE_HEIGHT_ABOVE_FEET = 1.8;
const CHASE_PITCH = 20 * Math.PI / 180;
const RESPAWN_BELOW_Y = -8;
const VIEWER_DISTANCE = 4.2;
const VIEWER_BASE_YAW = 35 * Math.PI / 180;
const VIEWER_PITCH = 22 * Math.PI / 180;
const OUTSIDE_CAMERA_POSITION = [-13, 13, -11];
const OUTSIDE_CAMERA_TARGET = [0, 0.5, 2.5];
const OUTSIDE_CAMERA_FOV = 40 * Math.PI / 180;
const VIEW_CONE_LENGTH = 4;
const WOBBLE_AMPLITUDE = 7 * Math.PI / 180;
const WOBBLE_PERIOD_S = 4;
const LINE_SUBDIVISIONS = 4;
const AUTO_CONTRAST_SMOOTHING = 0.15;
const PANEL_MARGIN = 16;
const VOID_HUE = 0;

const X = 0, Y = 1, Z = 2, W = 3;
const AXIS_NAMES = ['x', 'y', 'z', 'w'];
const RIGHT = 0, UP = 1, ANA = 2;

const FLOOR_4D = { center: [0, -0.25, 2, 0], half: [7, 0.25, 7, 7] };
const PLATFORMS_4D = [
  { center: [-2, 0.6, 1, -2], half: [0.8, 0.15, 0.8, 0.8] },
  { center: [2, 1.0, 2, 1], half: [0.7, 0.15, 0.9, 0.7] },
  { center: [0, 1.6, 4, 0], half: [1.0, 0.15, 0.6, 1.0] },
  { center: [-3, 2.2, 5, 3], half: [0.8, 0.15, 0.8, 0.6] },
  { center: [3, 2.6, 6, -3], half: [0.6, 0.15, 0.6, 0.9] },
  { center: [0, 3.0, 7, 4], half: [0.9, 0.15, 0.7, 0.7] },
  { center: [-1, 0.9, 3, 4], half: [0.6, 0.15, 0.6, 0.6] },
  { center: [1, 1.9, 1, -4], half: [0.7, 0.15, 0.7, 0.7] },
  { center: [4, 0.5, 4, 2], half: [0.8, 0.15, 0.8, 0.8] },
  { center: [-4, 1.3, 7, -1], half: [0.7, 0.15, 0.9, 0.7] },
];
const START_FEET_4D = [0, 0, -3.5, 0];

const TOGGLES = {
  mode3D: { key: 'm', label: 'M 3D mode', on: false, onChange: () => enterDimension(TOGGLES.mode3D.on ? 3 : 4) },
  outside: { key: 'p', label: 'P Outside view', on: true, dimensions: [3] },
  wobble: { key: '1', label: '1 Wobble', on: false, dimensions: [4] },
  color: { key: '2', label: '2 Colors', on: true },
  brightness: { key: '3', label: '3 Depth brightness', on: true, dimensions: [4] },
  autoContrast: { key: '4', label: '4 Auto-contrast', on: true, dimensions: [4] },
  width: { key: '5', label: '5 Depth width', on: true, dimensions: [4] },
  frame: { key: '6', label: '6 Retina box', on: true },
  labels: { key: '7', label: '7 Labels', on: true },
  floor: { key: '8', label: '8 Floor lines', on: true },
  dropLine: { key: '9', label: '9 Drop line', on: true },
  fly: { key: 'f', label: 'F Fly', on: false },
  reveal: { key: 'r', label: 'R Reveal offsets', on: false },
  info: { key: 'i', label: 'I Info', on: true },
};

const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);
const sub = (a, b) => a.map((v, i) => v - b[i]);
const add = (a, b) => a.map((v, i) => v + b[i]);
const scale = (a, k) => a.map(v => v * k);
const range = n => [...Array(n).keys()];

function hypercubeEdges(n) {
  const edges = [];
  for (let i = 0; i < 1 << n; i++) for (let bit = 0; bit < n; bit++) {
    const j = i ^ (1 << bit);
    if (i < j) edges.push([i, j]);
  }
  return edges;
}
function hypercubeVertices(center, half) {
  const verts = [];
  for (let i = 0; i < 1 << center.length; i++) verts.push(center.map((c, a) => c + ((i >> a) & 1 ? half[a] : -half[a])));
  return verts;
}
function boxSegments(center, half) {
  const verts = hypercubeVertices(center, half);
  return hypercubeEdges(center.length).map(([i, j]) => [verts[i], verts[j]]);
}
function box(center, half, extra = {}) {
  return {
    center, half, ...extra,
    min: center.map((c, a) => c - half[a]),
    max: center.map((c, a) => c + half[a]),
    segments: boxSegments(center, half),
  };
}

function buildWorld(n) {
  const pick = v => v.slice(0, n);
  const floor = box(pick(FLOOR_4D.center), pick(FLOOR_4D.half), { isFloor: true });
  const platforms = PLATFORMS_4D.map((p, i) => box(pick(p.center), pick(p.half), {
    hue: Math.round(i * 360 / PLATFORMS_4D.length),
    label: String(i + 1),
  }));
  const axes = range(n);
  return {
    n, floor, platforms,
    solids: [floor, ...platforms],
    start: pick(START_FEET_4D),
    axes,
    horizontalAxes: axes.filter(a => a !== Y),
    forward: n - 1,
    hasAna: n === 4,
  };
}

let world;
const player = {};
const stats = { falls: 0, landedOn: new Set() };

function levelBasis(n) {
  const basis = range(n).map(i => range(n).map(j => (i === j ? 1 : 0)));
  if (n === 4) [basis[ANA], basis[3]] = [[0, 0, 0, 1], [0, 0, 1, 0]];
  return basis;
}

function respawn() {
  player.feet = [...world.start];
  player.verticalSpeed = 0;
  player.grounded = false;
  player.basis = levelBasis(world.n);
}

function enterDimension(n) {
  world = buildWorld(n);
  stats.falls = 0;
  stats.landedOn.clear();
  respawn();
  Object.assign(depthRange, retinaDepthRange());
}

function rotatePlayerBasis(i, j, angle) {
  const c = Math.cos(angle), s = Math.sin(angle);
  const a = player.basis[i], b = player.basis[j];
  player.basis[i] = a.map((v, k) => c * v + s * b[k]);
  player.basis[j] = b.map((v, k) => -s * a[k] + c * v);
}

function reorthonormalizePlayerBasis() {
  const E = player.basis;
  for (let i = 0; i < E.length; i++) {
    for (let j = 0; j < i; j++) {
      const d = dot(E[i], E[j]);
      E[i] = E[i].map((v, k) => v - d * E[j][k]);
    }
    const n = Math.hypot(...E[i]);
    E[i] = E[i].map(v => v / n);
  }
}

function chaseCamera() {
  const P = player.basis, F = world.forward;
  const c = Math.cos(CHASE_PITCH), s = Math.sin(CHASE_PITCH);
  const basis = [...P];
  basis[F] = add(scale(P[F], c), scale(P[UP], -s));
  basis[UP] = add(scale(P[F], s), scale(P[UP], c));
  const position = add(add(player.feet, scale(P[UP], CHASE_HEIGHT_ABOVE_FEET)), scale(P[F], -CHASE_DISTANCE));
  return { position, basis };
}

function playerBox() {
  return {
    min: player.feet.map((v, k) => (k === Y ? v : v - PLAYER_HALF_WIDTH)),
    max: player.feet.map((v, k) => (k === Y ? v + PLAYER_HEIGHT : v + PLAYER_HALF_WIDTH)),
  };
}
const overlaps = (a, b) => world.axes.every(k => a.min[k] < b.max[k] && a.max[k] > b.min[k]);

const held = new Set();
const axisInput = (plus, minus) => (held.has(plus) ? 1 : 0) - (held.has(minus) ? 1 : 0);

function wishDirection() {
  const P = player.basis;
  let dir = add(scale(P[world.forward], axisInput('KeyW', 'KeyS')), scale(P[RIGHT], axisInput('KeyD', 'KeyA')));
  if (world.hasAna) dir = add(dir, scale(P[ANA], axisInput('KeyE', 'KeyQ')));
  const length = Math.hypot(...dir);
  return length > 1 ? scale(dir, 1 / length) : dir;
}

function stepFlying(dt) {
  const move = add(wishDirection(), scale(player.basis[UP], axisInput('Space', 'KeyC')));
  player.feet = add(player.feet, scale(move, FLY_SPEED * dt));
  player.verticalSpeed = 0;
  player.grounded = false;
}

function stepWalking(dt) {
  if (player.grounded && held.has('Space')) player.verticalSpeed = JUMP_SPEED;
  player.verticalSpeed = Math.max(player.verticalSpeed - GRAVITY * dt, -MAX_FALL_SPEED);
  const delta = scale(wishDirection(), WALK_SPEED * dt);
  delta[Y] = player.verticalSpeed * dt;
  player.grounded = false;
  for (const axis of [Y, ...world.horizontalAxes]) {
    if (!delta[axis]) continue;
    player.feet[axis] += delta[axis];
    const hit = world.solids.find(s => overlaps(playerBox(), s));
    if (!hit) continue;
    if (axis !== Y) { player.feet[axis] -= delta[axis]; continue; }
    if (delta[Y] < 0) {
      player.feet[Y] = hit.max[Y];
      player.grounded = true;
      if (hit.label) stats.landedOn.add(hit.label);
    } else {
      player.feet[Y] = hit.min[Y] - PLAYER_HEIGHT;
    }
    player.verticalSpeed = 0;
  }
  if (player.feet[Y] < RESPAWN_BELOW_Y) { stats.falls++; respawn(); }
}

function applyTurning(dt) {
  const F = world.forward;
  const turnForwardRight = axisInput('ArrowRight', 'ArrowLeft');
  if (turnForwardRight) rotatePlayerBasis(F, RIGHT, turnForwardRight * TURN_SPEED * dt);
  if (world.hasAna) {
    const turnForwardAna = axisInput('ArrowUp', 'ArrowDown');
    const spinRightAna = axisInput('KeyX', 'KeyZ');
    if (turnForwardAna) rotatePlayerBasis(F, ANA, turnForwardAna * TURN_SPEED * dt);
    if (spinRightAna) rotatePlayerBasis(RIGHT, ANA, spinRightAna * TURN_SPEED * dt);
  }
  reorthonormalizePlayerBasis();
}

function surfaceBelow(point) {
  const containsHorizontally = s => world.horizontalAxes.every(k => point[k] >= s.min[k] && point[k] <= s.max[k]);
  const candidates = world.solids.filter(s => s.max[Y] <= point[Y] + 1e-6 && containsHorizontally(s));
  if (!candidates.length) return null;
  return candidates.reduce((best, s) => (s.max[Y] > best.max[Y] ? s : best));
}

function sceneSegments() {
  const list = [];
  const addAll = (segments, style) => segments.forEach(([a, b]) => list.push({ a, b, style }));
  if (TOGGLES.floor.on) addAll(world.floor.segments, { kind: 'floor' });
  world.platforms.forEach(p => addAll(p.segments, { kind: 'platform', hue: p.hue }));
  const { min, max } = playerBox();
  addAll(boxSegments(min.map((v, k) => (v + max[k]) / 2), min.map((v, k) => (max[k] - v) / 2)), { kind: 'player' });

  if (TOGGLES.dropLine.on) {
    const surface = surfaceBelow(player.feet);
    const hit = [...player.feet];
    hit[Y] = surface ? surface.max[Y] : RESPAWN_BELOW_Y;
    const style = surface ? { kind: 'player' } : { kind: 'drop', hue: VOID_HUE };
    list.push({ a: player.feet, b: hit, style });
    for (const k of world.horizontalAxes) {
      const arm = hit.map(() => 0); arm[k] = 0.35;
      list.push({ a: sub(hit, arm), b: add(hit, arm), style });
    }
  }
  return list;
}

function frustumPlanes() {
  const F = world.forward;
  const planes = [c => c[F] - NEAR];
  for (let i = 0; i < F; i++) planes.push(c => FOV_HALF_ANGLE_TAN * c[F] - c[i], c => FOV_HALF_ANGLE_TAN * c[F] + c[i]);
  return planes;
}
function clipToFrustum(planes, a, b) {
  let t0 = 0, t1 = 1;
  for (const plane of planes) {
    const ga = plane(a), gb = plane(b);
    if (ga < 0 && gb < 0) return null;
    if (ga < 0) t0 = Math.max(t0, ga / (ga - gb));
    else if (gb < 0) t1 = Math.min(t1, ga / (ga - gb));
  }
  if (t0 > t1) return null;
  const lerp = t => a.map((v, k) => v + (b[k] - v) * t);
  return [lerp(t0), lerp(t1)];
}
const toCameraFrame = (camera, point) => camera.basis.map(e => dot(sub(point, camera.position), e));
const projectToRetina = c => c.slice(0, -1).map(v => v / c[c.length - 1] / FOV_HALF_ANGLE_TAN);
const lerpPoint = (a, b, t) => a.map((v, k) => v + (b[k] - v) * t);

function retinaSegments(camera) {
  const planes = frustumPlanes();
  const out = [];
  for (const { a, b, style } of sceneSegments()) {
    const clipped = clipToFrustum(planes, toCameraFrame(camera, a), toCameraFrame(camera, b));
    if (!clipped) continue;
    const ra = projectToRetina(clipped[0]), rb = projectToRetina(clipped[1]);
    for (let i = 0; i < LINE_SUBDIVISIONS; i++) {
      out.push({ ra: lerpPoint(ra, rb, i / LINE_SUBDIVISIONS), rb: lerpPoint(ra, rb, (i + 1) / LINE_SUBDIVISIONS), style });
    }
  }
  return out;
}

function visiblePlatformCenters(camera) {
  const planes = frustumPlanes();
  return world.platforms
    .map(p => ({ platform: p, c: toCameraFrame(camera, p.center) }))
    .filter(({ c }) => planes.every(plane => plane(c) >= 0))
    .map(({ platform, c }) => ({ platform, r: projectToRetina(c) }));
}

const canvas = document.getElementById('view');
const hud = document.getElementById('hud');
const revealPanel = document.getElementById('reveal');
const togglesBar = document.getElementById('toggles');
const ctx = canvas.getContext('2d');
let viewWidth = 0, viewHeight = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  viewWidth = window.innerWidth; viewHeight = window.innerHeight;
  canvas.width = viewWidth * dpr; canvas.height = viewHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const wobble = timeS => (TOGGLES.wobble.on ? WOBBLE_AMPLITUDE * Math.sin(2 * Math.PI * timeS / WOBBLE_PERIOD_S) : 0);

const depthRange = { near: 0, far: 1 };
const retinaDepthRange = () => ({ near: VIEWER_DISTANCE - Math.sqrt(3), far: VIEWER_DISTANCE + Math.sqrt(3) });
function updateDepthRange(pieces) {
  let target = retinaDepthRange();
  if (TOGGLES.autoContrast.on && pieces.length) {
    let near = Infinity, far = -Infinity;
    for (const { a, b } of pieces) {
      near = Math.min(near, a.depth, b.depth);
      far = Math.max(far, a.depth, b.depth);
    }
    target = { near, far: Math.max(far, near + 0.05) };
  }
  depthRange.near += (target.near - depthRange.near) * AUTO_CONTRAST_SMOOTHING;
  depthRange.far += (target.far - depthRange.far) * AUTO_CONTRAST_SMOOTHING;
}

const farness = depth => Math.min(1, Math.max(0, (depth - depthRange.near) / (depthRange.far - depthRange.near)));
const lightnessAt = depth => (depth !== null && TOGGLES.brightness.on ? 92 - 74 * farness(depth) : 68);
const widthAt = depth => (TOGGLES.width.on ? 0.7 + 3.3 * (1 - farness(depth)) : 1.6);

function colorFor(style, depth) {
  const lightness = lightnessAt(depth);
  if (style.kind === 'floor') return `hsl(210 12% ${lightness * 0.6}%)`;
  if (style.kind === 'player') return `hsl(0 0% ${lightness}%)`;
  if (style.kind === 'platform' && !TOGGLES.color.on) return `hsl(210 35% ${lightness}%)`;
  return `hsl(${style.hue} 90% ${lightness}%)`;
}
const labelColor = platform => (TOGGLES.color.on ? `hsl(${platform.hue} 85% 72%)` : '#e8edf3');

function strokeDepthLine(a, b, style) {
  const gradient = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
  gradient.addColorStop(0, colorFor(style, a.depth));
  gradient.addColorStop(1, colorFor(style, b.depth));
  ctx.strokeStyle = gradient;
  ctx.lineWidth = widthAt((a.depth + b.depth) / 2);
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
}

function drawLabel(text, x, y, color) {
  ctx.font = 'bold 13px ui-monospace, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

const RETINA_CUBE_VERTS = hypercubeVertices([0, 0, 0], [1, 1, 1]);
const RETINA_CUBE_EDGES = hypercubeEdges(3);

function cubeRetinaToScreen(r, yaw) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const x1 = cy * r[0] + sy * r[2];
  const z1 = -sy * r[0] + cy * r[2];
  const cp = Math.cos(VIEWER_PITCH), sp = Math.sin(VIEWER_PITCH);
  const y2 = cp * r[1] - sp * z1;
  const z2 = sp * r[1] + cp * z1;
  const depth = VIEWER_DISTANCE + z2;
  const k = 0.27 * Math.min(viewWidth, viewHeight) * VIEWER_DISTANCE / depth;
  return { x: viewWidth / 2 + x1 * k, y: viewHeight / 2 - y2 * k, depth };
}

function draw4D(camera, timeS) {
  const yaw = VIEWER_BASE_YAW + wobble(timeS);
  if (TOGGLES.frame.on) {
    ctx.strokeStyle = '#223044';
    ctx.lineWidth = 1;
    for (const [i, j] of RETINA_CUBE_EDGES) {
      const a = cubeRetinaToScreen(RETINA_CUBE_VERTS[i], yaw), b = cubeRetinaToScreen(RETINA_CUBE_VERTS[j], yaw);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }
  const pieces = retinaSegments(camera).map(({ ra, rb, style }) => {
    const a = cubeRetinaToScreen(ra, yaw), b = cubeRetinaToScreen(rb, yaw);
    return { a, b, style, depth: (a.depth + b.depth) / 2 };
  });
  updateDepthRange(pieces);
  pieces.sort((p, q) => q.depth - p.depth);
  ctx.lineCap = 'round';
  for (const { a, b, style } of pieces) strokeDepthLine(a, b, style);
  if (TOGGLES.labels.on) {
    for (const { platform, r } of visiblePlatformCenters(camera)) {
      const s = cubeRetinaToScreen(r, yaw);
      drawLabel(platform.label, s.x, s.y, labelColor(platform));
    }
  }
  return pieces.length / LINE_SUBDIVISIONS;
}

const PICTURE_CORNERS = hypercubeVertices([0, 0], [1, 1]);
const PICTURE_EDGES = hypercubeEdges(2);
const normalize = v => scale(v, 1 / Math.hypot(...v));
const LIGHT_DIRECTION = normalize([0.45, 1, -0.3]);
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

function outsideCamera(panel) {
  const forward = normalize(sub(OUTSIDE_CAMERA_TARGET, OUTSIDE_CAMERA_POSITION));
  const right = normalize(cross(forward, [0, 1, 0]));
  const up = cross(right, forward);
  const focal = panel.half / Math.tan(OUTSIDE_CAMERA_FOV / 2);
  const project = p => {
    const d = sub(p, OUTSIDE_CAMERA_POSITION);
    const depth = dot(d, forward);
    if (depth < 0.1) return null;
    return { x: panel.cx + dot(d, right) * focal / depth, y: panel.cy - dot(d, up) * focal / depth, depth };
  };
  return { project };
}

function boxFaces(min, max) {
  const faces = [];
  for (let axis = 0; axis < 3; axis++) for (const side of [-1, 1]) {
    const [b, c] = [0, 1, 2].filter(k => k !== axis);
    const corner = (sb, sc) => {
      const p = [];
      p[axis] = side < 0 ? min[axis] : max[axis];
      p[b] = sb < 0 ? min[b] : max[b];
      p[c] = sc < 0 ? min[c] : max[c];
      return p;
    };
    const normal = [0, 0, 0]; normal[axis] = side;
    faces.push({ normal, corners: [corner(-1, -1), corner(1, -1), corner(1, 1), corner(-1, 1)] });
  }
  return faces;
}

function solidColor(kind, hue, shade) {
  if (kind === 'floor') return `hsl(210 10% ${12 + 22 * shade}%)`;
  if (kind === 'player') return `hsl(0 0% ${45 + 45 * shade}%)`;
  if (!TOGGLES.color.on) return `hsl(210 30% ${25 + 40 * shade}%)`;
  return `hsl(${hue} 70% ${22 + 38 * shade}%)`;
}

function drawSolidBox(view, min, max, kind, hue) {
  const center = min.map((v, k) => (v + max[k]) / 2);
  for (const { normal, corners } of boxFaces(min, max)) {
    const faceCenter = add(center, normal.map((s, k) => s * (max[k] - min[k]) / 2));
    if (dot(normal, sub(OUTSIDE_CAMERA_POSITION, faceCenter)) <= 0) continue;
    const points = corners.map(view.project);
    if (points.some(p => !p)) continue;
    const shade = 0.25 + 0.75 * Math.max(0, dot(normal, LIGHT_DIRECTION));
    ctx.fillStyle = solidColor(kind, hue, shade);
    ctx.strokeStyle = '#05070b';
    ctx.lineWidth = 1;
    ctx.beginPath();
    points.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}

function strokeWorldLine(view, a, b, color, width = 1.5, dash = []) {
  const pa = view.project(a), pb = view.project(b);
  if (!pa || !pb) return;
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  ctx.setLineDash([]);
}

function drawViewCone(view, camera) {
  const F = world.forward;
  const apex = camera.position;
  const far = [-1, 1].flatMap(sr => [-1, 1].map(su => add(apex, scale(
    add(add(camera.basis[F], scale(camera.basis[RIGHT], sr * FOV_HALF_ANGLE_TAN)), scale(camera.basis[UP], su * FOV_HALF_ANGLE_TAN)),
    VIEW_CONE_LENGTH,
  ))));
  const coneColor = '#8fb3e0';
  far.forEach(corner => strokeWorldLine(view, apex, corner, coneColor, 1, [5, 4]));
  [[0, 1], [1, 3], [3, 2], [2, 0]].forEach(([i, j]) => strokeWorldLine(view, far[i], far[j], coneColor, 1, [5, 4]));
  const p = view.project(apex);
  if (p) {
    ctx.fillStyle = coneColor;
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 2 * Math.PI); ctx.fill();
    drawLabel('camera', p.x, p.y - 12, coneColor);
  }
}

function drawOutsideView(panel, camera) {
  const view = outsideCamera(panel);
  ctx.save();
  ctx.beginPath(); ctx.rect(panel.cx - panel.half, panel.cy - panel.half, 2 * panel.half, 2 * panel.half); ctx.clip();
  const distanceTo = b => Math.hypot(...sub(b.min.map((v, k) => (v + b.max[k]) / 2), OUTSIDE_CAMERA_POSITION));
  if (TOGGLES.floor.on) drawSolidBox(view, world.floor.min, world.floor.max, 'floor');
  const { min, max } = playerBox();
  const bodies = [
    ...world.platforms.map(p => ({ min: p.min, max: p.max, kind: 'platform', hue: p.hue })),
    { min, max, kind: 'player' },
  ].sort((a, b) => distanceTo(b) - distanceTo(a));
  bodies.forEach(b => drawSolidBox(view, b.min, b.max, b.kind, b.hue));

  if (TOGGLES.dropLine.on) {
    const surface = surfaceBelow(player.feet);
    const hit = [...player.feet]; hit[Y] = surface ? surface.max[Y] : RESPAWN_BELOW_Y;
    strokeWorldLine(view, player.feet, hit, surface ? '#e8edf3' : 'hsl(0 90% 60%)', 2);
  }
  drawViewCone(view, camera);
  if (TOGGLES.labels.on) {
    for (const p of world.platforms) {
      const top = [...p.center]; top[Y] = p.max[Y] + 0.35;
      const s = view.project(top);
      if (s) drawLabel(p.label, s.x, s.y, labelColor(p));
    }
  }
  ctx.restore();
  drawPanelCaption(panel, 'the world, from outside');
}

function drawPicture(panel, camera) {
  const toPanel = r => ({ x: panel.cx + r[0] * panel.half, y: panel.cy - r[1] * panel.half });
  if (TOGGLES.frame.on) {
    ctx.strokeStyle = '#223044'; ctx.lineWidth = 1;
    for (const [i, j] of PICTURE_EDGES) {
      const a = toPanel(PICTURE_CORNERS[i]), b = toPanel(PICTURE_CORNERS[j]);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }
  const pieces = retinaSegments(camera);
  ctx.lineCap = 'round';
  ctx.lineWidth = 1.6;
  for (const { ra, rb, style } of pieces) {
    const a = toPanel(ra), b = toPanel(rb);
    ctx.strokeStyle = colorFor(style, null);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  if (TOGGLES.labels.on) {
    for (const { platform, r } of visiblePlatformCenters(camera)) {
      const p = toPanel(r);
      drawLabel(platform.label, p.x, p.y, labelColor(platform));
    }
  }
  drawPanelCaption(panel, 'what the camera sees (the 2-projection)');
  return pieces.length / LINE_SUBDIVISIONS;
}

function drawPanelCaption(panel, text) {
  ctx.font = '12px ui-monospace, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = '#7f93ad';
  ctx.fillText(text, panel.cx, panel.cy - panel.half - 6);
}

function layout3D() {
  const left = TOGGLES.info.on ? hud.getBoundingClientRect().right + PANEL_MARGIN : PANEL_MARGIN;
  const right = viewWidth - PANEL_MARGIN;
  const top = PANEL_MARGIN + 18;
  const bottom = togglesBar.getBoundingClientRect().top - PANEL_MARGIN;
  const width = right - left, height = bottom - top;
  const panelCount = TOGGLES.outside.on ? 2 : 1;
  const sideBySide = panelCount === 1 || width / panelCount >= height * 0.8;
  const slotW = sideBySide ? width / panelCount : width;
  const slotH = sideBySide ? height : height / panelCount;
  const half = Math.max(40, Math.min(slotW, slotH) / 2 - PANEL_MARGIN);
  const slot = i => ({
    cx: sideBySide ? left + slotW * (i + 0.5) : left + width / 2,
    cy: sideBySide ? top + height / 2 : top + slotH * (i + 0.5),
    half,
  });
  return TOGGLES.outside.on ? { outside: slot(0), picture: slot(1) } : { picture: slot(0) };
}

function draw3D(camera) {
  const panels = layout3D();
  if (panels.outside) drawOutsideView(panels.outside, camera);
  return drawPicture(panels.picture, camera);
}

function drawScene(timeS) {
  ctx.clearRect(0, 0, viewWidth, viewHeight);
  const camera = chaseCamera();
  return world.n === 4 ? draw4D(camera, timeS) : draw3D(camera);
}

const fmt = v => (v >= 0 ? ' ' : '') + v.toFixed(2);
const basisLine = e => e.map((v, k) => Math.abs(v) > 0.05 ? `${v >= 0 ? '+' : '-'}${Math.abs(v).toFixed(2)}${AXIS_NAMES[k]}` : '').filter(Boolean).join(' ');
const feetLine = () => player.feet.map((v, k) => `${AXIS_NAMES[k]}${fmt(v)}`).join(' ');

function playerState() {
  if (TOGGLES.fly.on) return 'flying';
  return player.grounded ? 'grounded' : `airborne vy${fmt(player.verticalSpeed)}`;
}

const CONTROLS_4D =
`move   W/S fwd/back  A/D right/left  Q/E kata/ana
jump   Space   (fly: Space/C up/down)
turn   ←/→ fwd↔right   ↑/↓ fwd↔ana   Z/X spin right↔ana
H respawn   M switch to 3D`;
const CONTROLS_3D =
`move   W/S fwd/back  A/D right/left
jump   Space   (fly: Space/C up/down)
turn   ←/→ fwd↔right
H respawn   M switch to 4D
P hides the outside view: play from the picture alone,
  the way 4D mode makes you play`;

function renderPanels(lineCount) {
  const P = player.basis;
  const landed = [...stats.landedOn].sort((a, b) => a - b).join(' ') || '-';
  const anaLine = world.hasAna ? `\nana   ${basisLine(P[ANA])}   (retina depth axis)` : '';
  hud.textContent =
`PROTOTYPE: throwaway, ${world.n}D projection jump test
feet  ${feetLine()}
fwd   ${basisLine(P[world.forward])}
right ${basisLine(P[RIGHT])}${anaLine}
state ${playerState()}
landed on ${landed}  (${stats.landedOn.size}/${world.platforms.length})   falls ${stats.falls}
lines ${lineCount}

${world.n === 4 ? CONTROLS_4D : CONTROLS_3D}`;

  hud.style.display = TOGGLES.info.on ? 'block' : 'none';
  revealPanel.style.display = TOGGLES.reveal.on ? 'block' : 'none';
  if (!TOGGLES.reveal.on) return;
  const columns = world.hasAna ? [[RIGHT, 'right'], [UP, 'up'], [ANA, 'ana'], [world.forward, 'fwd']] : [[RIGHT, 'right'], [UP, 'up'], [world.forward, 'fwd']];
  const rows = world.platforms.map(p => {
    const top = [...p.center]; top[Y] = p.max[Y];
    const d = sub(top, player.feet);
    return `${p.label.padStart(2)}  ${columns.map(([i]) => fmt(dot(d, P[i])).padStart(6)).join(' ')}`;
  });
  revealPanel.textContent = `true offset from your feet to platform top\n #  ${columns.map(([, name]) => name.padStart(6)).join(' ')}\n${rows.join('\n')}`;
}

function flip(toggle) {
  toggle.on = !toggle.on;
  toggle.onChange?.();
  renderToggles();
}
const activeToggles = () => Object.values(TOGGLES).filter(t => !t.dimensions || t.dimensions.includes(world.n));
function renderToggles() {
  togglesBar.replaceChildren(...activeToggles().map(t => {
    const button = document.createElement('button');
    button.textContent = t.label;
    button.className = t.on ? 'on' : '';
    button.onclick = () => { flip(t); button.blur(); };
    return button;
  }));
}

const CAPTURED_KEYS = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'];
window.addEventListener('keydown', e => {
  if (CAPTURED_KEYS.includes(e.code)) e.preventDefault();
  held.add(e.code);
  if (e.repeat) return;
  const toggle = activeToggles().find(t => t.key === e.key.toLowerCase());
  if (toggle) flip(toggle);
  if (e.code === 'KeyH') respawn();
});
window.addEventListener('keyup', e => held.delete(e.code));
window.addEventListener('blur', () => held.clear());

enterDimension(4);
renderToggles();

let lastTimeMs = performance.now();
let physicsBacklogS = 0;
function tick(nowMs) {
  const dt = Math.min(0.1, (nowMs - lastTimeMs) / 1000);
  lastTimeMs = nowMs;
  applyTurning(dt);
  physicsBacklogS += dt;
  while (physicsBacklogS >= PHYSICS_STEP_S) {
    (TOGGLES.fly.on ? stepFlying : stepWalking)(PHYSICS_STEP_S);
    physicsBacklogS -= PHYSICS_STEP_S;
  }
  renderPanels(drawScene(nowMs / 1000));
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
