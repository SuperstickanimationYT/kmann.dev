<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE Merger Photo</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0b0e; color: #ddd; font: 13px/1.4 system-ui, sans-serif; display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; padding: 16px; }
  .banner { grid-column: 1 / -1; background: #5a3b00; color: #ffd27a; padding: 6px 10px; border-radius: 6px; }
  canvas[data-preview] { width: 100%; height: auto; background: #000; border-radius: 6px; }
  pre { white-space: pre-wrap; background: #16161b; padding: 8px; border-radius: 6px; }
  form { display: flex; flex-direction: column; gap: 8px; }
  label { display: grid; grid-template-columns: 90px 1fr 40px; align-items: center; gap: 6px; }
  [data-moments] { display: flex; flex-wrap: wrap; gap: 4px; }
  button { background: #22222a; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
  [data-sheet] { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
  figure { margin: 0; } figure canvas { width: 100%; border-radius: 4px; } figcaption { text-align: center; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<p class="banner">PROTOTYPE, throwaway: gravity-playground's galaxy merger (3000 stars each, baked by <code>bake.mjs</code>) rendered through the galaxy-photos pipeline. Question: does this look photoreal enough to be worth building properly?</p>
<main>
  <canvas data-preview></canvas>
  <pre data-state>Loading snapshots…</pre>
</main>
<form data-controls>
  <label>Time <input type="range" name="time" min="0" max="60" value="10"><output for="time"></output></label>
  <div data-moments></div>
  <label>Field (kpc) <input type="range" name="field" min="20" max="120" value="75"><output for="field"></output></label>
  <label>Inclination <input type="range" name="inclination" min="0" max="85" value="35"><output for="inclination"></output></label>
  <label>Angle <input type="range" name="angle" min="0" max="359" value="20"><output for="angle"></output></label>
  <label>Young <input type="range" name="young" min="0" max="100" value="80"><output for="young"></output></label>
  <label>Gas <input type="range" name="gas" min="0" max="100" value="70"><output for="gas"></output></label>
  <label>Dust <input type="range" name="dust" min="0" max="100" value="60"><output for="dust"></output></label>
  <label>Bulges <input type="range" name="bulge" min="0" max="100" value="35"><output for="bulge"></output></label>
  <label>Disk light <input type="range" name="disk" min="0" max="100" value="70"><output for="disk"></output></label>
  <label>Exposure <input type="range" name="exposure" min="0" max="100" value="51"><output for="exposure"></output></label>
  <label>Seed <input type="number" name="seed" value="1"><span></span></label>
  <label>Telescope <select name="telescope"><option>hubble</option><option>jwst</option><option>roman</option><option>ground</option></select><span></span></label>
  <button type="button" data-contact-sheet>Render contact sheet (10 moments)</button>
</form>
<section data-sheet></section>
<script type="module" src="prototype.js"></script>
</body>
</html>
